databases:
  - name: pawpreview-validation-db
    databaseName: pawpreview_validation_db
    user: pawpreview_validation_db_user
    plan: free
    region: virginia
    postgresMajorVersion: 16

services:
  - type: web
    name: pawpreview-validation
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pawpreview-validation-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://pawpreview.onrender.com
      - key: STATIC_SITE_URL
        value: https://pawpreview.onrender.com

  - type: web
    name: pawpreview
    runtime: static
    buildCommand: "true"
    staticPublishPath: site
